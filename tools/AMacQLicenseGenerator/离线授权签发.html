<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMacQ 离线授权签发</title>
  <style>
    :root { color-scheme: dark; font-family: "SF Pro Display", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    * { -webkit-tap-highlight-color: transparent; letter-spacing: 0; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 36px 0; background: #111418; color: #f3f7fb; }
    main { width: min(620px, calc(100% - 40px)); padding: 34px; border: 1px solid #34404a; border-radius: 12px; background: #1a2026; box-shadow: 0 18px 46px rgb(0 0 0 / 35%); }
    h1 { margin: 0 0 8px; font-size: 25px; } p, .hint { color: #aebbc7; line-height: 1.65; }
    label { position: relative; display: block; margin: 20px 0 8px; font-weight: 650; }
    input, select, button { box-sizing: border-box; width: 100%; border-radius: 8px; font: inherit; }
    input, select { position: relative; padding: 13px 14px; border: 1px solid #3b4853; outline: none; background: #11161b; box-shadow: inset 0 1px 1px rgb(0 0 0 / 34%); color: inherit; transition: border-color .2s, background .2s, box-shadow .2s; }
    input:focus, select:focus { border-color: #1598ff; background: #131b22; box-shadow: 0 0 0 3px rgb(21 152 255 / 22%); }
    input::file-selector-button { margin: -7px 12px -7px -8px; padding: 9px 12px; border: 1px solid #4a5965; border-radius: 6px; background: #26313a; color: #f3f7fb; font: inherit; cursor: pointer; }
    button { margin-top: 28px; padding: 14px; border: 1px solid #42adff; background: #168ff0; box-shadow: 0 8px 18px rgb(0 86 160 / 28%); color: #fff; font-weight: 750; cursor: pointer; transition: transform .18s, background .18s; }
    button:hover { background: #29a0ff; } button:active { transform: scale(.985); background: #087bda; } button:disabled { opacity: .55; cursor: wait; } #expiryArea { display: none; } #status { position: relative; min-height: 24px; margin: 16px 0 0; color: #c7d9e8; white-space: pre-wrap; }
    .warning { position: relative; margin-top: 26px; padding: 14px 15px; border: 1px solid #70582a; border-radius: 8px; background: #2a2417; color: #f5d999; font-size: 13px; line-height: 1.65; }
    @media (max-width: 520px) {
      body { display: block; padding: 12px; }
      main { width: 100%; max-width: none; box-sizing: border-box; padding: 22px 16px 18px; border-radius: 16px; }
      h1 { font-size: 22px; line-height: 1.3; }
      p { margin: 0; font-size: 14px; line-height: 1.6; }
      label { margin-top: 18px; margin-bottom: 7px; font-size: 14px; }
      input, select, button { min-height: 48px; font-size: 16px; }
      input[type="file"] { overflow: hidden; padding: 7px 8px; text-overflow: ellipsis; white-space: nowrap; }
      input::file-selector-button { margin: 0 10px 0 0; padding: 8px 10px; }
      button { margin-top: 22px; padding: 12px; }
      #status { min-height: 42px; margin-top: 14px; font-size: 14px; line-height: 1.55; }
      .warning { margin-top: 18px; padding: 12px; border-radius: 10px; font-size: 12px; line-height: 1.6; }
    }
    @media (max-width: 360px) {
      body { padding: 8px; }
      main { padding: 18px 14px 16px; border-radius: 12px; }
      h1 { font-size: 20px; }
      input::file-selector-button { margin-right: 6px; padding: 8px; }
    }
  </style>
</head>
<body>
<main>
  <h1>AMacQ 离线授权签发</h1>
  <p>选择仅保存在你电脑上的 RSA 私钥，输入客户机器码后生成许可证文件。</p>

  <label for="privateKey">RSA 私钥（XML）</label>
  <!-- 部分安卓文件选择器不会将 XML 识别为 text/xml；允许所有类型以确保能选到私钥。 -->
  <input id="privateKey" type="file" accept="*/*">

  <label for="machineCode">客户机器码</label>
  <input id="machineCode" autocomplete="off" spellcheck="false" maxlength="64" placeholder="粘贴 64 位机器码">

  <label for="mode">授权类型</label>
  <select id="mode"><option value="perpetual">永久授权</option><option value="expires">限时授权</option></select>

  <div id="expiryArea">
    <label for="expiry">到期日期（当天 23:59:59 到期）</label>
    <input id="expiry" type="date">
  </div>

  <button id="generate">生成许可证文件</button>
  <div id="status" role="status"></div>
  <div class="warning">私钥绝不能发送给客户、上传网盘或提交到 Git。此文件仅供授权方离线使用；生成许可证后可安全地将许可证 JSON 发送给客户。</div>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const mode = $('mode'), expiryArea = $('expiryArea'), status = $('status'), generate = $('generate');
  const defaultExpiry = new Date();
  defaultExpiry.setDate(defaultExpiry.getDate() + 2);
  $('expiry').value = `${defaultExpiry.getFullYear()}-${String(defaultExpiry.getMonth() + 1).padStart(2, '0')}-${String(defaultExpiry.getDate()).padStart(2, '0')}`;
  mode.addEventListener('change', () => expiryArea.style.display = mode.value === 'expires' ? 'block' : 'none');

  const toBase64Url = text => text.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
  function xmlValue(xml, name) {
    const value = xml.querySelector(name)?.textContent?.trim();
    if (!value) throw new Error(`私钥缺少 ${name} 字段。`);
    return toBase64Url(value);
  }
  async function importPrivateKey(xmlText) {
    const documentXml = new DOMParser().parseFromString(xmlText, 'application/xml');
    if (documentXml.querySelector('parsererror')) throw new Error('私钥 XML 格式无效。');
    const key = { kty: 'RSA', n: xmlValue(documentXml, 'Modulus'), e: xmlValue(documentXml, 'Exponent'), d: xmlValue(documentXml, 'D'), p: xmlValue(documentXml, 'P'), q: xmlValue(documentXml, 'Q'), dp: xmlValue(documentXml, 'DP'), dq: xmlValue(documentXml, 'DQ'), qi: xmlValue(documentXml, 'InverseQ'), ext: true, key_ops: ['sign'] };
    return crypto.subtle.importKey('jwk', key, { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' }, false, ['sign']);
  }
  function base64(bytes) {
    let binary = ''; bytes.forEach(byte => binary += String.fromCharCode(byte)); return btoa(binary);
  }
  function canonicalUtcForDate(dateString) {
    const date = new Date(`${dateString}T23:59:59.999Z`);
    if (Number.isNaN(date.getTime())) throw new Error('请选择有效的到期日期。');
    return date.toISOString().replace('Z', '0000Z');
  }
  function download(name, contents) {
    const link = document.createElement('a');
    link.href = URL.createObjectURL(new Blob([contents], { type: 'application/json;charset=utf-8' }));
    link.download = name; link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  }
  generate.addEventListener('click', async () => {
    try {
      if (!window.crypto?.subtle) throw new Error('当前浏览器不支持 Web Crypto，请使用最新版 Edge 或 Chrome 打开。');
      const file = $('privateKey').files[0];
      if (!file) throw new Error('请选择 RSA 私钥 XML。');
      const machineCode = $('machineCode').value.trim().toUpperCase();
      if (!/^[0-9A-F]{64}$/.test(machineCode)) throw new Error('机器码必须是 64 位十六进制字符。');
      const expiresUtc = mode.value === 'expires' ? canonicalUtcForDate($('expiry').value) : '';
      const payload = `1\n${machineCode}\n${mode.value}\n${expiresUtc}`;
      generate.disabled = true; status.textContent = '正在签名…';
      const privateKey = await importPrivateKey(await file.text());
      const signature = base64(new Uint8Array(await crypto.subtle.sign('RSASSA-PKCS1-v1_5', privateKey, new TextEncoder().encode(payload))));
      // DataContractJsonSerializer 使用 /Date(UnixMilliseconds)/ 表示 DateTime。
      const license = { version: '1', machineCode, mode: mode.value, expiresUtc: expiresUtc ? `/Date(${Date.parse(expiresUtc)})/` : null, signature };
      download(`AMacQ-license-${machineCode.slice(0, 8)}.json`, JSON.stringify(license));
      status.textContent = '许可证已生成。请将下载的 JSON 文件发送给对应客户导入。';
    } catch (error) { status.textContent = `签发失败：${error.message || error}`; }
    finally { generate.disabled = false; }
  });
})();
</script>
</body>
</html>
